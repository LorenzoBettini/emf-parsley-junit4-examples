name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B test

      - name: Build with Maven (Windows and macOS)
        if: runner.os != 'Linux'
        run: mvn -B test
